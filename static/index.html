<!DOCTYPE html>
<html>
<head>
    <title>Fly-Tipping Report</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.1/axios.min.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY" async defer></script>
    <script src="app.js" defer></script>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        .w3-container h2 {
            font-size: 24px;
        }
        .w3-container label, .w3-container input, .w3-container select, .w3-container textarea, .w3-container button {
            font-size: 18px;
        }
        .spinner {
            display: none;
            border: 8px solid #f3f3f3;
            border-top: 8px solid #3498db;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 2s linear infinite;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .w3-button {
            background-color: #4CAF50; /* Green */
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
        }
        .w3-button:hover {
            background-color: #45a049;
        }
        .w3-card-4 {
            background-color: #f8f8f8;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 16px;
            margin: 16px 0;
        }
        .w3-metro-darken {
            background-color: #3498db !important; /* Blue */
            color: white;
        }
        #map {
            height: 500px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="w3-container w3-metro-darken w3-padding-16">
        <h2 class="w3-center">Fly-Tipping Report</h2>
    </div>

    <div class="w3-container w3-padding">
        <div class="w3-card-4 w3-margin" id="loginFormContainer">
            <div class="w3-container w3-metro-darken w3-padding-16">
                <h2>Login</h2>
            </div>
            <form class="w3-container" id="loginForm">
                <p>
                    <label>Username</label>
                    <input class="w3-input w3-padding-16" type="text" id="loginUsername" required>
                </p>
                <p>
                    <label>Password</label>
                    <input class="w3-input w3-padding-16" type="password" id="loginPassword" required>
                </p>
                <button class="w3-button" type="submit">Login</button>
            </form>
        </div>

        <div class="w3-card-4 w3-margin" id="registerFormContainer">
            <div class="w3-container w3-metro-darken w3-padding-16">
                <h2>Register</h2>
            </div>
            <form class="w3-container" id="registerForm">
                <p>
                    <label>Username</label>
                    <input class="w3-input w3-padding-16" type="text" id="registerUsername" required>
                </p>
                <p>
                    <label>Email</label>
                    <input class="w3-input w3-padding-16" type="email" id="registerEmail" required>
                </p>
                <p>
                    <label>Password</label>
                    <input class="w3-input w3-padding-16" type="password" id="registerPassword" required>
                </p>
                <p>
                    <label>Country</label>
                    <input class="w3-input w3-padding-16" type="text" id="registerCountry">
                </p>
                <p>
                    <label>Postcode</label>
                    <input class="w3-input w3-padding-16" type="text" id="registerPostcode">
                </p>
                <button class="w3-button" type="submit">Register</button>
            </form>
        </div>

        <div class="w3-card-4 w3-margin" id="reportFormContainer" style="display:none;">
            <div class="w3-container w3-metro-darken w3-padding-16">
                <h2>Report Fly-Tipping</h2>
            </div>
            <form class="w3-container" id="reportForm">
                <p>
                    <label>Location</label>
                    <input class="w3-input w3-padding-16" type="text" id="location" required>
                </p>
                <p>
                    <label>Coordinates</label>
                    <input class="w3-input w3-padding-16" type="text" id="coordinates" required>
                </p>
                <p>
                    <label>Materials</label>
                    <select class="w3-select w3-padding-16" id="materials" multiple required>
                        <option value="paper">Paper</option>
                        <option value="glass">Glass</option>
                        <option value="plastic">Plastic</option>
                        <option value="metal">Metal</option>
                        <option value="other">Other</option>
                    </select>
                </p>
                <p>
                    <label>Notes</label>
                    <textarea class="w3-input w3-padding-16" id="notes"></textarea>
                </p>
                <p>
                    <label>Photos</label>
                    <input class="w3-input w3-padding-16" type="file" id="photos" multiple>
                </p>
                <button class="w3-button" type="submit">Submit Report</button>
            </form>
        </div>

        <div id="logoutContainer" class="w3-margin" style="display:none;">
            <button class="w3-button" id="logoutButton">Logout</button>
        </div>

        <div id="viewToggleContainer" class="w3-margin" style="display:none;">
            <button class="w3-button" id="listViewButton">List View</button>
            <button class="w3-button" id="mapViewButton">Map View</button>
        </div>

        <div id="userReportsContainer" class="w3-margin" style="display:none;">
            <h2>Your Reports</h2>
            <div id="userReports"></div>
        </div>

        <div id="mapContainer" class="w3-margin" style="display:none;">
            <h2>Your Reports on Map</h2>
            <div id="map"></div>
        </div>

        <div class="spinner" id="spinner"></div>
    </div>
</body>
</html>
